  verify-release:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless this commit was promoted
          command: |
            if ! grep -qx promoted /tmp/ws/state 2>/dev/null; then
              echo "This commit was not promoted; nothing to verify or roll back."
              circleci-agent step halt
            fi
      - run:
          name: Halt if a newer commit already owns main
          command: bash scripts/ci/require_head.sh
      - run:
          name: Public smoke and /ready through the public URL (no credentials; about 90 s for cold starts)
          command: |
            mkdir -p /tmp/verify
            pip install --quiet httpx
            result=failed
            for i in 1 2 3 4 5 6; do
              if bash scripts/ci/public_smoke.sh; then result=ok; break; fi
              echo "attempt $i failed"; sleep 15
            done
            echo "$result" > /tmp/verify/result
            echo "verify-release result: $result (a failure is handled by rollback-api, the app rollbacks and smoke-public)"
      - persist_to_workspace:
          root: /tmp/verify
          paths:
            - result

  rollback-api:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless the public check failed
          command: |
            if ! grep -qx failed /tmp/ws/result 2>/dev/null; then
              echo "The public check passed; nothing to roll back."
              circleci-agent step halt
            fi
      - run:
          name: Put the API back on the previous revision (exit 2 means it refused, and that stops the web rollback)
          command: |
            bash scripts/ci/gcp_login.sh
            PROMOTE_DIR=/tmp/ws bash scripts/ci/rollback.sh
      - persist_to_workspace:
          root: /tmp/ws
          paths:
            - rollback_state

  rollback-realtime:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless the public check failed
          command: |
            if ! grep -qx failed /tmp/ws/result 2>/dev/null; then
              echo "The public check passed; nothing to roll back."
              circleci-agent step halt
            fi
      - run:
          name: Put the live-feed gateway back on its previous revision (nothing to do if this release did not promote it)
          command: |
            bash scripts/ci/gcp_login.sh
            SERVICE=clinic-realtime PROMOTE_DIR=/tmp/ws/promoted-realtime bash scripts/ci/rollback.sh

  rollback-app:
    parameters:
      app:
        description: The app directory under apps/ (booking or admin)
        type: string
      project_id:
        description: Vercel project id for this app when it differs from the context's (not a secret)
        type: string
        default: ""
    docker:
      - image: mirror.gcr.io/cimg/node:24.14
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Choose this app's Vercel token (the admin app has its own project and token)
          command: bash scripts/ci/select_vercel_token.sh "<< parameters.app >>"
      - run:
          name: Select the Vercel project for this app (the context holds the booking project's id)
          command: |
            echo 'export VERCEL_APP="<< parameters.app >>"' >> "$BASH_ENV"
            if [ -n "<< parameters.project_id >>" ]; then
              echo 'export VERCEL_PROJECT_ID="<< parameters.project_id >>"' >> "$BASH_ENV"
            fi
            # Identifiers only (never the token), so a 403 can be told from a wrong project.
            PROJECT="<< parameters.project_id >>"; PROJECT="${PROJECT:-$VERCEL_PROJECT_ID}"
            echo "Vercel target: app=<< parameters.app >> project=${PROJECT} team=${VERCEL_ORG_ID:0:9}..."
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless the public check failed
          command: |
            if ! grep -qx failed /tmp/ws/result 2>/dev/null; then
              echo "The public check passed; nothing to roll back."
              circleci-agent step halt
            fi
      - run:
          name: Only roll the web app back if the API went back first
          command: |
            grep -Eqx "rolled-back|already-previous" /tmp/ws/rollback_state 2>/dev/null || {
              echo "FAIL: the API was not rolled back, so the web app stays on the release that matches it."; exit 1; }
      - run:
          name: Point production at the previous deployment, by id
          command: |
            sudo npm install -g vercel@59.5.0 --ignore-scripts
            VERCEL_APP="<< parameters.app >>" bash scripts/ci/vercel_prod.sh rollback "$(cat "/tmp/ws/prev-<< parameters.app >>")"
      - run:
          name: Mark the << parameters.app >> deploy as failed
          command: circleci run release update ship-<< parameters.app >> --status=FAILED --failure-reason="rolled back by the public check" || echo "WARNING - ship-web was already marked finished, so its marker could not be changed"

  smoke-public:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless this commit was promoted (otherwise the smoke tests an older release)
          command: |
            if ! grep -qx promoted /tmp/ws/state 2>/dev/null; then
              echo "This commit was not promoted; skipping the public smoke."
              circleci-agent step halt
            fi
      - run:
          name: Halt if a newer commit already owns main
          command: bash scripts/ci/require_head.sh
      - run:
          name: A release that was rolled back stays red
          command: |
            if grep -qx failed /tmp/ws/result 2>/dev/null; then
              echo "FAIL: the public check failed and this release was rolled back (see rollback-api and the app rollbacks)."; exit 1
            fi
      - run:
          name: Public smoke (no Vercel or GCP credentials)
          command: |
            pip install --quiet httpx
            bash scripts/ci/public_smoke.sh
      - run:
          name: IAM deny-proof, direct run.app (403 anonymous, 401 junk bearer; no credentials)
          command: |
            # Written as a redacted record and kept as an artifact (docs/adr/0016 proof, docs/evidence).
            mkdir -p /tmp/evidence
            bash scripts/ci/deny_probe.sh run-app /tmp/evidence/iam-deny-run-app.txt
      - store_artifacts:
          path: /tmp/evidence/iam-deny-run-app.txt
          destination: evidence/iam-deny-run-app.txt
          when: always

  zap-prod:
    # ZAP baseline against the live site once the release is verified (docs/adr/0017). Passive only,
    # read-only against production: it spiders for one minute and inspects responses. Same image
    # digest and rules file as the PR dast job; exit 0/2 pass, 1/3 fail.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless this commit was promoted (otherwise the scan would test an older release)
          command: |
            if ! grep -qx promoted /tmp/ws/state 2>/dev/null; then
              echo "This commit was not promoted; skipping the production scan."
              circleci-agent step halt
            fi
      - run:
          name: Halt if a newer commit already owns main
          command: bash scripts/ci/require_head.sh
      - run:
          name: ZAP baseline against the public site (passive, one-minute spider)
          command: |
            set +e
            bash scripts/ci/zap_prod_baseline.sh
            echo $? > /tmp/zap-prod-exit
            exit 0
      - store_artifacts:
          path: .zap/zap-prod-report.html
      - store_artifacts:
          path: .zap/zap-prod-report.json
      - run:
          name: Enforce the scan result
          command: test "$(cat /tmp/zap-prod-exit)" = 0

  wif-deny-probe:
    # Runs only on the test/wif-deny branch (workflow wif-deny), on the empty oidc-probe context:
    # the token exchange must be refused and no deploy variable may be present (docs/adr/0016).
    docker:
      - image: mirror.gcr.io/cimg/base:current
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: WIF exchange is refused and the deploy variables are absent
          command: |
            mkdir -p /tmp/evidence
            set +e
            bash scripts/ci/deny_probe.sh wif /tmp/evidence/iam-deny-wif.txt; a=$?
            bash scripts/ci/deny_probe.sh context /tmp/evidence/iam-deny-context.txt; b=$?
            echo "$a$b" > /tmp/wif-probe-exit
            exit 0
      - store_artifacts:
          path: /tmp/evidence
          destination: evidence
          when: always
      - run:
          name: Enforce the probes
          command: test "$(cat /tmp/wif-probe-exit)" = 00

  cost-static:
    docker:
      - image: mirror.gcr.io/cimg/base:current
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install ripgrep
          command: |
            # a third-party PPA index can 503; ripgrep is in the main archive
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq ripgrep
      - run:
          name: Static cost guards
          command: bash scripts/cost_check.sh --static
      - run:
          name: CI script tests (promote, prune, head guard, fail-closed skip)
          command: bash scripts/ci/test_ci_scripts.sh
      - run:
          name: Cost guard self-test (every banned flag and bypass, by mutation)
          command: bash scripts/cost_check_selftest.sh

  cost-check:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless this commit was promoted (the promoted release checks the live state)
          command: |
            # A release that a newer commit superseded cleans up its own tag and image in ship-api, but
            # the newer release's image is already in the registry by then and counts as a version.
            # That transient is not a cost overrun; the release that promoted runs this gate and sees
            # the settled state.
            if ! grep -qx promoted /tmp/ws/state 2>/dev/null; then
              echo "This commit was not promoted; the promoted release runs the live cost check."
              circleci-agent step halt
            fi
      - run:
          name: WIF login (read-only roles)
          command: bash scripts/ci/gcp_login.sh
      - run:
          name: Live cost guards
          command: |
            export PROJECT="$GOOGLE_PROJECT_ID"
            # Three checks cannot run here, and the run says so ("PARTIAL, not OK", each one named):
            # C11-budgets and C14 need a billing role the deployer must never hold on the shared
            # account (the engineer runs them locally), and C13 needs neonctl and a Neon API key.
            # They are listed on purpose: any other unverified check makes this job fail.
            export COST_CHECK_ALLOW_UNVERIFIED="C11-budgets C13 C14"
            bash scripts/cost_check.sh --live

workflows:
  pr:
    when:
      and:
        - not:
            equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.git.tag >>
    jobs:
      - lint
      - backend-quality
      - backend-test
      - backend-contract
      - go-quality
      - ably-real:
          context: ably-ci
      - secrets
      - sast
      - sca
      - build-scan
      - dast
      - web-quality
      - e2e-real:
          context: ably-ci
      - admin-e2e
      - cost-static

  wif-deny:
    when:
      equal: [test/wif-deny, << pipeline.git.branch >>]
    jobs:
      - wif-deny-probe:
          context: oidc-probe

  release:
    when:
      and:
        - equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.git.tag >>
    jobs:
      - lint
      - backend-quality
      - backend-test
      - backend-contract
      - go-quality
      - ably-real:
          context: ably-ci
      - secrets
      - sast
      - sca
      - build-scan
      - web-quality
      - e2e-real:
          context: ably-ci
      - admin-e2e
      - cost-static
      - build-scan-push:
          context: gcp-deploy
          requires:
            - lint
            - backend-quality
            - backend-test
            - backend-contract
            - go-quality
            - secrets
            - sast
            - sca
            - build-scan
            - cost-static
      - ship-api:
          context: gcp-deploy
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - build-scan-push
      - build-scan-push-realtime:
          context: gcp-deploy
          requires:
            - go-quality
            - cost-static
            - backend-quality
      - ship-realtime:
          context: gcp-deploy
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - ship-api
            - build-scan-push-realtime
      - build-app:
          name: build-booking
          app: booking
          requires:
            - web-quality
            - e2e-real
      - build-app:
          name: build-admin
          app: admin
          requires:
            - web-quality
            - admin-e2e
      - ship-app:
          name: ship-booking
          app: booking
          component: clinic-web
          context: vercel-prod
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - ship-api
            - build-booking
      - ship-app:
          name: ship-admin
          app: admin
          component: clinic-admin
          context: vercel-prod
          project_id: prj_Y5T4nteV26yu6A9pVSMy2YLZgE4w
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - ship-api
            - build-admin
      - verify-release:
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - ship-booking
            - ship-admin
      - rollback-api:
          context: gcp-deploy
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - verify-release
      - rollback-realtime:
          context: gcp-deploy
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - verify-release
            - ship-realtime
      - rollback-app:
          name: rollback-booking
          app: booking
          context: vercel-prod
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - rollback-api
      - rollback-app:
          name: rollback-admin
          app: admin
          context: vercel-prod
          project_id: prj_Y5T4nteV26yu6A9pVSMy2YLZgE4w
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - rollback-api
      - smoke-public:
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - rollback-booking
            - rollback-admin
      - cost-check:
          context: gcp-deploy
          requires:
            - ship-api
      - zap-prod:
          requires:
            - smoke-public
