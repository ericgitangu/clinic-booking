version: 2.1

# Cost rules: resource_class small for lint-class jobs, medium otherwise;
# never large/Gen2; no docker_layer_caching. cimg/* images authenticate with the free-tier
# read-only Docker Hub token (a context attached to every job that pulls one) so Docker Hub's
# shared-IP limits never fail a build.

commands:
  install_deps:
    description: Install uv and sync the backend environment from the lockfile.
    steps:
      - restore_cache:
          keys:
            - uv-v1-{{ checksum "backend/uv.lock" }}
      - run:
          name: Install uv
          command: pip install uv==0.11.28
      - run:
          name: uv sync --frozen
          command: cd backend && uv sync --frozen
      - save_cache:
          key: uv-v1-{{ checksum "backend/uv.lock" }}
          paths:
            - backend/.venv
            - ~/.cache/uv

  trivy_cache_restore:
    description: Restore the Trivy vulnerability DB, keyed by day (falls back to the newest).
    steps:
      - run:
          name: Cache key for today
          command: date -u +%F > /tmp/trivy-date
      - restore_cache:
          keys:
            - trivy-db-v1-{{ checksum "/tmp/trivy-date" }}
            - trivy-db-v1-

  trivy_cache_save:
    description: Save the Trivy vulnerability DB under today's key.
    steps:
      - save_cache:
          key: trivy-db-v1-{{ checksum "/tmp/trivy-date" }}
          paths:
            - ~/.cache/trivy

  create_app_role:
    description: Create the clinic_app role in the CI Postgres (local/CI only).
    steps:
      - run:
          name: Wait for Postgres and create clinic_app
          command: cd backend && uv run python -m scripts.ci_create_role

executors:
  backend:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
    resource_class: small
    working_directory: ~/repo

  lint:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12-node
    resource_class: small
    working_directory: ~/repo

  backend_db:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
      - image: mirror.gcr.io/cimg/postgres:17.11
        environment:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
    resource_class: medium
    working_directory: ~/repo

jobs:
  lint:
    executor: lint
    steps:
      - checkout
      - install_deps
      - run:
          name: Install node dependencies
          command: |
            sudo npm install -g pnpm@12.5.1
            pnpm install --frozen-lockfile --ignore-scripts
      - run:
          name: make lint (the same target the pre-push hook runs)
          command: make lint
      - run:
          name: make hygiene
          command: make hygiene
      - run:
          name: Generated API client is fresh (regenerate from the contract, no diff allowed)
          command: |
            make gen-client
            git diff --exit-code packages/api/src/generated
      - run:
          name: Repo hygiene self-test
          command: bash scripts/repo_hygiene_selftest.sh

  backend-quality:
    executor: backend
    steps:
      - checkout
      - install_deps
      - run:
          name: migration lint (expand-only) + single head
          command: |
            bash scripts/migration_lint.sh
            test "$(cd backend && uv run alembic heads | wc -l | tr -d ' ')" -eq 1
      - run:
          name: OpenAPI contract is fresh
          command: |
            make openapi
            git diff --exit-code contracts/openapi.json

  backend-test:
    executor: backend_db
    steps:
      - checkout
      - install_deps
      - create_app_role
      - run:
          name: migrate + seed
          command: cd backend && DATABASE_URL=postgresql+asyncpg://clinic:clinic@localhost:5432/clinic uv run alembic upgrade head && DATABASE_URL=postgresql+asyncpg://clinic:clinic@localhost:5432/clinic uv run python -m app.scripts.seed
      - run:
          name: unit + integration + migrations + race + control
          command: |
            cd backend
            uv run pytest tests/unit tests/integration tests/migrations \
              -m "not race and not control" \
              --junitxml=test-results/pytest/results.xml \
              --cov=app --cov-report=xml --cov-fail-under=85
            uv run pytest -m race -rA
            uv run pytest -m control -rA
      - store_test_results:
          path: backend/test-results
      - store_artifacts:
          path: backend/coverage.xml

  backend-contract:
    executor: backend_db
    steps:
      - checkout
      - install_deps
      - create_app_role
      - run:
          name: migrate + seed
          command: cd backend && DATABASE_URL=postgresql+asyncpg://clinic:clinic@localhost:5432/clinic uv run alembic upgrade head && DATABASE_URL=postgresql+asyncpg://clinic:clinic@localhost:5432/clinic uv run python -m app.scripts.seed
      - run:
          name: schemathesis contract tests
          command: cd backend && uv run pytest tests/contract -q

  secrets:
    executor: backend
    steps:
      - checkout
      - run:
          name: gitleaks (full history)
          command: |
            VERSION=8.30.1
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
            ./gitleaks git --no-banner

  sast:
    executor: backend
    steps:
      - checkout
      - run:
          name: semgrep (no login, no telemetry)
          command: |
            pip install semgrep==1.181.0
            semgrep --config p/python --config p/typescript --config p/owasp-top-ten --error --metrics=off

  sca:
    executor: backend
    steps:
      - checkout
      - install_deps
      - run:
          name: pip-audit over locked deps
          command: |
            cd backend
            uv export --frozen --no-dev --format requirements-txt > requirements.txt
            uv run pip-audit -r requirements.txt

  build-scan:
    docker:
      - image: mirror.gcr.io/cimg/base:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Skip when nothing this job covers changed (fails closed)
          command: bash scripts/ci/skip_unless_changed.sh backend/ infra/ .trivyignore .circleci/
      - setup_remote_docker
      - run:
          name: Build image (no attestations -> one Artifact Registry version)
          command: |
            cd backend
            docker buildx build --provenance=false --sbom=false --load -t clinic-api:ci .
      - trivy_cache_restore
      - run:
          name: Trivy image + config scan (HIGH/CRITICAL, fixed only)
          command: |
            VERSION=0.76.0
            curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" | tar -xz trivy
            ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 clinic-api:ci
            # trivy config takes ONE path per call; scan the Dockerfile, and infra/ once it exists.
            ./trivy config --exit-code 1 --severity HIGH,CRITICAL backend/Dockerfile
            if [ -d infra ]; then ./trivy config --exit-code 1 --severity HIGH,CRITICAL infra; fi
      - trivy_cache_save
  dast:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Skip when nothing this job covers changed (fails closed)
          command: bash scripts/ci/skip_unless_changed.sh backend/ docker-compose.yml .zap/ .circleci/
      - run:
          name: ZAP API scan against the compose stack
          command: |
            docker compose up -d --wait
            NET=$(docker network ls --filter name=clinic_default --format '{{.Name}}')
            chmod a+rwx .zap   # the ZAP container user is not the runner's uid
            set +e
            docker run --rm --network "$NET" -v "$PWD/.zap:/zap/wrk" \
              ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
              zap-api-scan.py -t http://api:8080/openapi.json -f openapi -c rules.tsv -r zap-report.html
            code=$?
            echo "zap exit=$code"
            # 0 = no alerts, 2 = warnings only -> pass; 1, 3 -> fail.
            [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
      - store_artifacts:
          path: .zap/zap-report.html

  # ---------------------------------------------------------------- release-only jobs
  # These need the engineer's cloud setup (contexts gcp-deploy / vercel-prod, WIF). They are
  # inert until the GCP and Vercel setup (WIF pools, service accounts, contexts) has been
  # applied; nothing here creates infrastructure.
  build-scan-push:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: WIF login + Artifact Registry docker auth
          command: |
            bash scripts/ci/gcp_login.sh
            gcloud auth configure-docker "us-east4-docker.pkg.dev" --quiet
      - run:
          name: Build (one manifest -> one Artifact Registry version)
          command: |
            IMAGE="us-east4-docker.pkg.dev/${GOOGLE_PROJECT_ID}/clinic/clinic-api:sha-${CIRCLE_SHA1:0:7}"
            docker buildx build --provenance=false --sbom=false --load -t "$IMAGE" backend
            echo "export IMAGE=$IMAGE" >> "$BASH_ENV"
      - trivy_cache_restore
      - run:
          name: Trivy scan before push (HIGH/CRITICAL, fixed only)
          command: |
            VERSION=0.76.0
            curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" | tar -xz trivy
            ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - trivy_cache_save
      - run:
          name: Push and record the digest
          command: |
            docker push "$IMAGE"
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
            mkdir -p /tmp/ws
            printf %s "$DIGEST" > /tmp/ws/image_ref
      - persist_to_workspace:
          root: /tmp/ws
          paths:
            - image_ref

  ship-api:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Deploy marker, planned (CircleCI Deploys)
          command: |
            circleci run release plan ship-api --environment-name=production \
              --component-name=clinic-api --namespace=clinic --target-version="sha-${CIRCLE_SHA1:0:7}" || echo "WARNING - the deploy marker was not recorded"
      - run:
          name: WIF login
          command: bash scripts/ci/gcp_login.sh
      - run:
          name: Deploy marker, running
          command: circleci run release update ship-api --status=running || echo "WARNING - the deploy marker was not updated"
      - run:
          name: Migrate (Cloud Run job, bounded timeout, no retries)
          command: |
            IMAGE_REF="$(cat /tmp/ws/image_ref)"
            gcloud run jobs deploy clinic-migrate --image "$IMAGE_REF" --region us-east4 --service-account "clinic-migrate@${GOOGLE_PROJECT_ID}.iam.gserviceaccount.com" --set-secrets DATABASE_URL=clinic-database-url-migrate:latest --task-timeout 600s --max-retries 0 --command sh --args="-c,alembic upgrade head && python -m app.scripts.seed" --quiet
            gcloud run jobs execute clinic-migrate --region us-east4 --wait
      - run:
          name: Deploy a tagged revision with no traffic
          command: |
            : "${PUBLIC_BASE_URL:?gcp-deploy context is missing PUBLIC_BASE_URL}"
            : "${WEB_ORIGIN:?gcp-deploy context is missing WEB_ORIGIN}"
            : "${GOOGLE_PROJECT_ID:?gcp-deploy context is missing GOOGLE_PROJECT_ID}"
            IMAGE_REF="$(cat /tmp/ws/image_ref)"
            gcloud run deploy clinic-api --image "$IMAGE_REF" --region us-east4 --no-traffic --tag "sha-${CIRCLE_SHA1:0:7}" --service-account "clinic-api-runtime@${GOOGLE_PROJECT_ID}.iam.gserviceaccount.com" --set-secrets DATABASE_URL=clinic-database-url-app:latest --set-env-vars "GIT_SHA=${CIRCLE_SHA1},PUBLIC_BASE_URL=${PUBLIC_BASE_URL},WEB_ORIGIN=${WEB_ORIGIN}" --min-instances 0 --max-instances 3 --concurrency 80 --cpu 1 --memory 512Mi --cpu-boost --timeout 60 --add-custom-audiences=clinic-api --quiet
      - run:
          name: Tag-URL smoke behind the C19 egress gate
          command: |
            set +x
            TAG_URL="$(gcloud run services describe clinic-api --region us-east4 --format=json | jq -r '.status.traffic[]|select(.tag=="sha-'"${CIRCLE_SHA1:0:7}"'")|.url')"
            test -n "$TAG_URL" || { echo 'FAIL: tag URL not found'; exit 1; }
            test "$(curl -s --max-time 5 https://ipinfo.io/country)" = US || { echo 'FAIL C19: CircleCI egress outside North America; tag-URL smoke skipped, nothing promoted'; exit 1; }
            python3 -m pip install --quiet httpx
            TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="clinic-smoke@${GOOGLE_PROJECT_ID}.iam.gserviceaccount.com" --audiences=clinic-api)"
            python3 scripts/verify_claims.py --base-url "$TAG_URL" --header "X-Serverless-Authorization: Bearer ${TOKEN}"
      - run:
          name: Promote only if this commit is still main's head
          command: bash scripts/ci/promote.sh "sha-${CIRCLE_SHA1:0:7}"
      - persist_to_workspace:
          root: /tmp/promoted
          paths:
            - state
            - keep.json
      - run:
          name: Prune superseded revisions and images (best effort; cost-check C6 flags leftovers)
          command: bash scripts/ci/prune.sh || echo "WARN prune failed; the next cost-check will report any extra versions"
      - run:
          name: Deploy marker, success
          command: circleci run release update ship-api --status=SUCCESS || echo "WARNING - the deploy marker was not updated"
          when: on_success
      - run:
          name: Deploy marker, failed
          command: circleci run release update ship-api --status=FAILED --failure-reason="ship-api failed" || echo "WARNING - the deploy marker was not updated"
          when: on_fail

  build-app:
    parameters:
      app:
        description: The app directory under apps/ (booking or admin)
        type: string
    docker:
      - image: mirror.gcr.io/cimg/node:24.14
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install without lifecycle scripts, then build with no Vercel credential
          command: |
            sudo npm install -g pnpm@12.5.1
            pnpm install --frozen-lockfile --ignore-scripts
            VERCEL_APP_DIR="apps/<< parameters.app >>" bash scripts/ci/vercel_offline_build.sh
            mv .vercel/output ".vercel/output-<< parameters.app >>"
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - persist_to_workspace:
          # The prebuilt output points at files in the repo tree (apps/<app>/.next, about 27 MB), not
          # only at .vercel/output, so both travel to the deploy job.
          root: /home/circleci/repo
          paths:
            - .vercel/output-<< parameters.app >>
            - apps/<< parameters.app >>/.next

  ship-app:
    parameters:
      app:
        description: The app directory under apps/ (booking or admin)
        type: string
      project_id:
        description: Vercel project id for this app when it differs from the context's (not a secret)
        type: string
        default: ""
      component:
        description: The component name on the CircleCI deploy marker
        type: string
    docker:
      - image: mirror.gcr.io/cimg/node:24.14
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Select the Vercel project for this app (the context holds the booking project's id)
          command: |
            echo 'export VERCEL_APP="<< parameters.app >>"' >> "$BASH_ENV"
            if [ -n "<< parameters.project_id >>" ]; then
              echo 'export VERCEL_PROJECT_ID="<< parameters.project_id >>"' >> "$BASH_ENV"
            fi
            # Identifiers only (never the token), so a 403 can be told from a wrong project.
            PROJECT="<< parameters.project_id >>"; PROJECT="${PROJECT:-$VERCEL_PROJECT_ID}"
            echo "Vercel target: app=<< parameters.app >> project=${PROJECT} team=${VERCEL_ORG_ID:0:9}..."
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless ship-api promoted this commit
          command: |
            if ! grep -qx promoted /tmp/ws/state 2>/dev/null; then
              echo "ship-api did not promote this commit: the web builds must not ship a contract newer than the live API."
              circleci-agent step halt
            fi
      - run:
          name: Halt if a newer commit already owns main
          command: bash scripts/ci/require_head.sh
      - run:
          name: Deploy marker, planned and running (CircleCI Deploys)
          command: |
            circleci run release plan ship-<< parameters.app >> --environment-name=production \
              --component-name=<< parameters.component >> --namespace=clinic --target-version="sha-${CIRCLE_SHA1:0:7}" || echo "WARNING - the deploy marker was not recorded"
            circleci run release update ship-<< parameters.app >> --status=running || echo "WARNING - the deploy marker was not updated"
      - run:
          name: Install dependencies and the Vercel CLI without lifecycle scripts
          command: |
            # The prebuilt output lists files under the root node_modules, and the CLI checks that
            # they exist before uploading, so a fresh checkout needs the same install as the build.
            # Scripts stay off, so no package code runs in the job that holds the Vercel token.
            sudo npm install -g pnpm@12.5.1 vercel@59.5.0 --ignore-scripts
            pnpm install --frozen-lockfile --ignore-scripts
      - run:
          name: Record the production deployment that is live now (the rollback target)
          command: |
            mkdir -p /tmp/webstate
            export VERCEL_APP="<< parameters.app >>"
            bash scripts/ci/vercel_prod.sh current | tee "/tmp/webstate/prev-<< parameters.app >>"
      - run:
          name: Deploy the prebuilt output (the only step that needs the Vercel token)
          command: |
            mkdir -p .vercel
            cp -R "/tmp/ws/.vercel/output-<< parameters.app >>" .vercel/output
            cp -R "/tmp/ws/apps/<< parameters.app >>/.next" "apps/<< parameters.app >>/.next"
            export VERCEL_APP="<< parameters.app >>"
            URL="$(npm_config_ignore_scripts=true vercel deploy --prebuilt --prod | tail -1)"
            echo "deployed $URL"
            NEW="$(bash scripts/ci/vercel_prod.sh id-of "$URL")"
            # A rollback switches off automatic alias assignment, so make sure the public alias
            # really serves this deployment, promoting it if it does not.
            bash scripts/ci/vercel_prod.sh ensure "$NEW" | tee "/tmp/webstate/new-<< parameters.app >>"
      - persist_to_workspace:
          root: /tmp/webstate
          paths:
            - prev-<< parameters.app >>
            - new-<< parameters.app >>
      - run:
          name: Deploy marker, success
          command: circleci run release update ship-<< parameters.app >> --status=SUCCESS || echo "WARNING - the deploy marker was not updated"
          when: on_success
      - run:
          name: Deploy marker, failed
          command: circleci run release update ship-<< parameters.app >> --status=FAILED --failure-reason="ship-<< parameters.app >> failed" || echo "WARNING - the deploy marker was not updated"
          when: on_fail

  web-quality:
    docker:
      - image: mirror.gcr.io/cimg/node:24.14
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Skip when apps/, packages/ and contracts/ are untouched (fails closed)
          command: bash scripts/ci/skip_unless_changed.sh apps/ packages/ contracts/ pnpm-lock.yaml pnpm-workspace.yaml package.json
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install, lint, typecheck, test, build
          command: |
            sudo npm install -g pnpm@12.5.1
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm audit --prod --audit-level high
            pnpm -r --if-present test
            pnpm -r --if-present build
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

  e2e-real:
    # The same booking scenarios as web-e2e, but against the real API and database from
    # docker-compose (migrations and seed included) instead of the in-memory stand-in.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Skip when nothing this job covers changed (fails closed)
          command: bash scripts/ci/skip_unless_changed.sh apps/ packages/ backend/ contracts/ docker-compose.yml pnpm-lock.yaml pnpm-workspace.yaml package.json .circleci/
      - run:
          name: API and database (compose runs the migrations and the seed)
          command: docker compose up -d --build --wait
      - run:
          name: Build the booking app and run the booking scenarios against the real API
          command: |
            # The machine image has no Node 24: fetch the official build and check it against its
            # published SHA-256 before using it.
            curl -fsSLO https://nodejs.org/dist/v24.14.0/node-v24.14.0-linux-x64.tar.xz
            echo "41cd79bb7877c81605a9e68ec4c91547774f46a40c67a17e34d7179ef11729df  node-v24.14.0-linux-x64.tar.xz" | sha256sum -c -
            sudo tar -xJf node-v24.14.0-linux-x64.tar.xz -C /usr/local --strip-components=1
            node --version
            sudo npm install -g pnpm@12.5.1
            pnpm install --frozen-lockfile --ignore-scripts
            # the generated client against the real API (reads, real problems, the whole booking path)
            REAL_API_URL=http://127.0.0.1:8080 pnpm -C packages/api exec vitest run tests/real-api.test.ts
            pnpm -C apps/booking build
            pnpm -C apps/booking exec playwright install --with-deps chromium
            E2E_API_URL=http://127.0.0.1:8080 PW_BUNDLED=1 pnpm -C apps/booking test:e2e booking
      - run:
          name: API logs
          command: docker compose logs api | tail -80
          when: on_fail

  web-e2e:
    docker:
      - image: mirror.gcr.io/cimg/node:24.14-browsers
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Skip when apps/, packages/ and contracts/ are untouched (fails closed)
          command: bash scripts/ci/skip_unless_changed.sh apps/ packages/ contracts/ pnpm-lock.yaml pnpm-workspace.yaml package.json
      - run:
          name: Build the web app and run the mobile layout checks (Playwright's Chromium)
          command: |
            sudo npm install -g pnpm@12.5.1
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm -C apps/booking build
            pnpm -C apps/booking exec playwright install chromium
            PW_BUNDLED=1 pnpm -C apps/booking test:e2e

  verify-release:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless this commit was promoted
          command: |
            if ! grep -qx promoted /tmp/ws/state 2>/dev/null; then
              echo "This commit was not promoted; nothing to verify or roll back."
              circleci-agent step halt
            fi
      - run:
          name: Halt if a newer commit already owns main
          command: bash scripts/ci/require_head.sh
      - run:
          name: Public smoke and /ready through the public URL (no credentials; about 90 s for cold starts)
          command: |
            mkdir -p /tmp/verify
            pip install --quiet httpx
            result=failed
            for i in 1 2 3 4 5 6; do
              if bash scripts/ci/public_smoke.sh; then result=ok; break; fi
              echo "attempt $i failed"; sleep 15
            done
            echo "$result" > /tmp/verify/result
            echo "verify-release result: $result (a failure is handled by rollback-api, the app rollbacks and smoke-public)"
      - persist_to_workspace:
          root: /tmp/verify
          paths:
            - result

  rollback-api:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless the public check failed
          command: |
            if ! grep -qx failed /tmp/ws/result 2>/dev/null; then
              echo "The public check passed; nothing to roll back."
              circleci-agent step halt
            fi
      - run:
          name: Put the API back on the previous revision (exit 2 means it refused, and that stops the web rollback)
          command: |
            bash scripts/ci/gcp_login.sh
            PROMOTE_DIR=/tmp/ws bash scripts/ci/rollback.sh
      - persist_to_workspace:
          root: /tmp/ws
          paths:
            - rollback_state

  rollback-app:
    parameters:
      app:
        description: The app directory under apps/ (booking or admin)
        type: string
      project_id:
        description: Vercel project id for this app when it differs from the context's (not a secret)
        type: string
        default: ""
    docker:
      - image: mirror.gcr.io/cimg/node:24.14
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Select the Vercel project for this app (the context holds the booking project's id)
          command: |
            echo 'export VERCEL_APP="<< parameters.app >>"' >> "$BASH_ENV"
            if [ -n "<< parameters.project_id >>" ]; then
              echo 'export VERCEL_PROJECT_ID="<< parameters.project_id >>"' >> "$BASH_ENV"
            fi
            # Identifiers only (never the token), so a 403 can be told from a wrong project.
            PROJECT="<< parameters.project_id >>"; PROJECT="${PROJECT:-$VERCEL_PROJECT_ID}"
            echo "Vercel target: app=<< parameters.app >> project=${PROJECT} team=${VERCEL_ORG_ID:0:9}..."
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless the public check failed
          command: |
            if ! grep -qx failed /tmp/ws/result 2>/dev/null; then
              echo "The public check passed; nothing to roll back."
              circleci-agent step halt
            fi
      - run:
          name: Only roll the web app back if the API went back first
          command: |
            grep -Eqx "rolled-back|already-previous" /tmp/ws/rollback_state 2>/dev/null || {
              echo "FAIL: the API was not rolled back, so the web app stays on the release that matches it."; exit 1; }
      - run:
          name: Point production at the previous deployment, by id
          command: |
            sudo npm install -g vercel@59.5.0 --ignore-scripts
            VERCEL_APP="<< parameters.app >>" bash scripts/ci/vercel_prod.sh rollback "$(cat "/tmp/ws/prev-<< parameters.app >>")"
      - run:
          name: Mark the << parameters.app >> deploy as failed
          command: circleci run release update ship-<< parameters.app >> --status=FAILED --failure-reason="rolled back by the public check" || echo "WARNING - ship-web was already marked finished, so its marker could not be changed"

  smoke-public:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless this commit was promoted (otherwise the smoke tests an older release)
          command: |
            if ! grep -qx promoted /tmp/ws/state 2>/dev/null; then
              echo "This commit was not promoted; skipping the public smoke."
              circleci-agent step halt
            fi
      - run:
          name: Halt if a newer commit already owns main
          command: bash scripts/ci/require_head.sh
      - run:
          name: A release that was rolled back stays red
          command: |
            if grep -qx failed /tmp/ws/result 2>/dev/null; then
              echo "FAIL: the public check failed and this release was rolled back (see rollback-api and the app rollbacks)."; exit 1
            fi
      - run:
          name: Public smoke (no Vercel or GCP credentials)
          command: |
            pip install --quiet httpx
            bash scripts/ci/public_smoke.sh

  cost-static:
    docker:
      - image: mirror.gcr.io/cimg/base:current
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install ripgrep
          command: |
            # a third-party PPA index can 503; ripgrep is in the main archive
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq ripgrep
      - run:
          name: Static cost guards
          command: bash scripts/cost_check.sh --static
      - run:
          name: CI script tests (promote, prune, head guard, fail-closed skip)
          command: bash scripts/ci/test_ci_scripts.sh
      - run:
          name: Cost guard self-test (every banned flag and bypass, by mutation)
          command: bash scripts/cost_check_selftest.sh

  cost-check:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: WIF login (read-only roles)
          command: bash scripts/ci/gcp_login.sh
      - run:
          name: Live cost guards
          command: |
            export PROJECT="$GOOGLE_PROJECT_ID"
            bash scripts/cost_check.sh --live

workflows:
  pr:
    when:
      and:
        - not:
            equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.git.tag >>
    jobs:
      - lint
      - backend-quality
      - backend-test
      - backend-contract
      - secrets
      - sast
      - sca
      - build-scan
      - dast
      - web-quality
      - web-e2e
      - e2e-real
      - cost-static

  release:
    when:
      and:
        - equal: [main, << pipeline.git.branch >>]
        - not: << pipeline.git.tag >>
    jobs:
      - lint
      - backend-quality
      - backend-test
      - backend-contract
      - secrets
      - sast
      - sca
      - build-scan
      - web-quality
      - web-e2e
      - e2e-real
      - cost-static
      - build-scan-push:
          context: gcp-deploy
          requires:
            - lint
            - backend-quality
            - backend-test
            - backend-contract
            - secrets
            - sast
            - sca
            - build-scan
            - cost-static
      - ship-api:
          context: gcp-deploy
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - build-scan-push
      - build-app:
          name: build-booking
          app: booking
          requires:
            - web-quality
            - e2e-real
      - build-app:
          name: build-admin
          app: admin
          requires:
            - web-quality
      - ship-app:
          name: ship-booking
          app: booking
          component: clinic-web
          context: vercel-prod
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - ship-api
            - build-booking
      - ship-app:
          name: ship-admin
          app: admin
          component: clinic-admin
          context: vercel-prod
          project_id: prj_Y5T4nteV26yu6A9pVSMy2YLZgE4w
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - ship-api
            - build-admin
      - verify-release:
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - ship-booking
            - ship-admin
      - rollback-api:
          context: gcp-deploy
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - verify-release
      - rollback-app:
          name: rollback-booking
          app: booking
          context: vercel-prod
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - rollback-api
      - rollback-app:
          name: rollback-admin
          app: admin
          context: vercel-prod
          project_id: prj_Y5T4nteV26yu6A9pVSMy2YLZgE4w
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - rollback-api
      - smoke-public:
          serial-group: << pipeline.project.slug >>/deploy-prod
          requires:
            - rollback-booking
            - rollback-admin
      - cost-check:
          context: gcp-deploy
          requires:
            - ship-api
