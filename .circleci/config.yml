version: 2.1

# Cost rules: resource_class small for lint-class jobs, medium otherwise;
# never large/Gen2; no docker_layer_caching. cimg/* images authenticate with the free-tier
# read-only Docker Hub token (a context attached to every job that pulls one) so Docker Hub's
# shared-IP limits never fail a build.

commands:
  install_deps:
    description: Install uv and sync the backend environment from the lockfile.
    steps:
      - restore_cache:
          keys:
            - uv-v1-{{ checksum "backend/uv.lock" }}
      - run:
          name: Install uv
          command: pip install uv==0.11.28
      - run:
          name: uv sync --frozen
          command: cd backend && uv sync --frozen
      - save_cache:
          key: uv-v1-{{ checksum "backend/uv.lock" }}
          paths:
            - backend/.venv
            - ~/.cache/uv

  trivy_cache_restore:
    description: Restore the Trivy vulnerability DB, keyed by day (falls back to the newest).
    steps:
      - run:
          name: Cache key for today
          command: date -u +%F > /tmp/trivy-date
      - restore_cache:
          keys:
            - trivy-db-v1-{{ checksum "/tmp/trivy-date" }}
            - trivy-db-v1-

  trivy_cache_save:
    description: Save the Trivy vulnerability DB under today's key.
    steps:
      - save_cache:
          key: trivy-db-v1-{{ checksum "/tmp/trivy-date" }}
          paths:
            - ~/.cache/trivy

  owner_emails:
    description: >-
      The one place the owner addresses are set (ADMIN_EMAILS for clinic-api and clinic-realtime,
      which must agree: both resolve the owner role from it). Exported as OWNER_EMAILS.
    steps:
      - run:
          name: Owner addresses (ADMIN_EMAILS, shared by the API and the gateway)
          command: |
            owners="developer.ericgitangu@gmail.com"
            # gcloud --set-env-vars splits on commas; a second owner needs a custom delimiter there.
            case "$owners" in *,*) echo "OWNER_EMAILS holds a comma: change the deploy delimiter first" >&2; exit 1 ;; esac
            echo "export OWNER_EMAILS=$owners" >> "$BASH_ENV"

  create_app_role:
    description: Create the clinic_app role in the CI Postgres (local/CI only).
    steps:
      - run:
          name: Wait for Postgres and create clinic_app
          command: cd backend && uv run python -m scripts.ci_create_role

executors:
  backend:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
    resource_class: small
    working_directory: ~/repo

  lint:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12-node
    resource_class: small
    working_directory: ~/repo

  backend_db:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
      - image: mirror.gcr.io/cimg/postgres:17.11
        environment:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
    resource_class: medium
    working_directory: ~/repo

  go_db:
    docker:
      - image: mirror.gcr.io/cimg/go:1.26
      - image: mirror.gcr.io/cimg/postgres:17.11
        environment:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
    resource_class: medium
    working_directory: ~/repo

jobs:
  lint:
    executor: lint
    steps:
      - checkout
      - install_deps
      - run:
          name: Install node dependencies
          command: |
            sudo npm install -g pnpm@12.5.1
            pnpm install --frozen-lockfile --ignore-scripts
      - run:
          name: make lint (the same target the pre-push hook runs)
          command: make lint
      - run:
          name: make hygiene
          command: make hygiene
      - run:
          name: Generated API client is fresh (regenerate from the contract, no diff allowed)
          command: |
            make gen-client
            # status, not diff: a generated file that is not tracked yet counts as a change too
            test -z "$(git status --porcelain packages/api/src/generated apps/booking/src/generated)" || { git status --porcelain packages/api/src/generated apps/booking/src/generated; exit 1; }
      - run:
          name: Repo hygiene self-test
          command: bash scripts/repo_hygiene_selftest.sh

  backend-quality:
    executor: backend
    steps:
      - checkout
      - install_deps
      - run:
          name: migration lint (expand-only) + single head
          command: |
            bash scripts/migration_lint.sh
            python3 scripts/alembic_single_head.py
            test "$(cd backend && uv run alembic heads | wc -l | tr -d ' ')" -eq 1
      - run:
          name: OpenAPI contract is fresh
          command: |
            make openapi
            git diff --exit-code contracts/openapi.json

  backend-test:
    executor: backend_db
    steps:
      - checkout
      - install_deps
      - create_app_role
      - run:
          name: migrate + seed
          command: cd backend && DATABASE_URL=postgresql+asyncpg://clinic:clinic@localhost:5432/clinic uv run alembic upgrade head && DATABASE_URL=postgresql+asyncpg://clinic:clinic@localhost:5432/clinic uv run python -m app.scripts.seed
      - run:
          name: unit + integration + migrations + race + control
          command: |
            cd backend
            uv run pytest tests/unit tests/integration tests/migrations \
              -m "not race and not control" \
              --junitxml=test-results/pytest/results.xml \
              --cov=app --cov-report=xml --cov-fail-under=85
            # the pure domain is held to 95% by its own unit tests alone (two decimals: see pyproject), so
            # integration coverage cannot stand in for them
            uv run pytest tests/unit --cov=app/domain --cov-report=term --cov-fail-under=95
            uv run pytest -m race -rA
            uv run pytest -m control -rA
      - store_test_results:
          path: backend/test-results
      - store_artifacts:
          path: backend/coverage.xml

  go-quality:
    description: services/realtime, the Go live-feed gateway. gofmt, vet, staticcheck, golangci-lint, gosec, govulncheck and the race-enabled tests against a real Postgres and the real API.
    executor: go_db
    steps:
      - checkout
      - run:
          name: Install uv and sync the backend (the tests book through the real API)
          command: |
            curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.local/bin:$PATH"
            cd backend && uv sync --frozen
      - create_app_role
      - run:
          name: A fresh signing key for this run (the API and the staff-action tests share it)
          command: echo "export INTERNAL_SIGNING_KEY=$(openssl rand -hex 32)" >> "$BASH_ENV"
      - run:
          name: migrate + seed, then start the API the tests book through
          command: |
            cd backend
            export DATABASE_URL=postgresql+asyncpg://clinic:clinic@localhost:5432/clinic
            uv run alembic upgrade head
            uv run python -m app.scripts.seed
            DATABASE_URL=postgresql+asyncpg://clinic_app:clinic_app_local@localhost:5432/clinic \
              nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8080 > /tmp/api.log 2>&1 &
            for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
            curl -fsS http://127.0.0.1:8080/health
      - run:
          name: make lint-go (gofmt, go vet, staticcheck, golangci-lint; strict, no baseline; the pre-push hook runs it too)
          command: make lint-go
      - run:
          name: gosec and govulncheck (any finding fails)
          command: |
            cd services/realtime
            go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet ./...
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run:
          name: go test -race against the real database and API
          command: |
            cd services/realtime
            export TEST_OWNER_DSN=postgres://clinic:clinic@127.0.0.1:5432/clinic
            export TEST_REALTIME_DSN=postgres://clinic_realtime:clinic_realtime_local@127.0.0.1:5432/clinic
            export TEST_API_URL=http://127.0.0.1:8080
            export TEST_API_SIGNING_KEY="$INTERNAL_SIGNING_KEY"
            go test -race -count=1 ./...
      - store_artifacts:
          path: /tmp/api.log

  backend-contract:
    executor: backend_db
    steps:
      - checkout
      - install_deps
      - create_app_role
      - run:
          name: migrate + seed
          command: cd backend && DATABASE_URL=postgresql+asyncpg://clinic:clinic@localhost:5432/clinic uv run alembic upgrade head && DATABASE_URL=postgresql+asyncpg://clinic:clinic@localhost:5432/clinic uv run python -m app.scripts.seed
      - run:
          name: schemathesis contract tests
          command: cd backend && uv run pytest tests/contract -q

  # The live leg: the adapter and the tokens against the real push service (a CI-only Ably app).
  # Nothing here needs the database. The key arrives from the `ably-ci` context (publish, subscribe
  # and history on the CI app only) and is read by the tests from the environment; it is never
  # echoed. This context is unrestricted, so a pull-request branch can use it: the key can only
  # publish to a throwaway app. A missing key fails the job instead of skipping the tests.
  ably-real:
    executor: backend
    steps:
      - checkout
      - run:
          name: Skip when nothing this job covers changed (fails closed)
          command: bash scripts/ci/skip_unless_changed.sh backend/ .circleci/
      - install_deps
      - run:
          name: The real push service (tests/integration/test_ably_real.py, all must run and pass)
          command: |
            set +x
            : "${ABLY_API_KEY:?the ably-ci context is missing ABLY_API_KEY}"
            cd backend
            uv run pytest tests/integration/test_ably_real.py -q -rs --junitxml=test-results/ably-real.xml
            # skipped tests would mean the key never reached them: that is a failure here
            ! grep -q 'skipped="[1-9]' test-results/ably-real.xml
      - store_test_results:
          path: backend/test-results

  secrets:
    executor: backend
    steps:
      - checkout
      - restore_cache:
          keys:
            - gitleaks-v1-{{ checksum "scripts/ci/install_gitleaks.sh" }}
      - run:
          name: Install gitleaks (pinned, checksum verified, one retry)
          command: bash scripts/ci/install_gitleaks.sh
      - save_cache:
          key: gitleaks-v1-{{ checksum "scripts/ci/install_gitleaks.sh" }}
          paths:
            - ~/.cache/gitleaks
      - run:
          name: gitleaks (full history)
          command: ./gitleaks git --no-banner

  sast:
    executor: backend
    steps:
      - checkout
      - run:
          name: semgrep (no login, no telemetry)
          command: |
            pip install semgrep==1.181.0
            semgrep --config p/python --config p/typescript --config p/owasp-top-ten --error --metrics=off

  sca:
    executor: backend
    steps:
      - checkout
      - install_deps
      - run:
          name: pip-audit over locked deps
          command: |
            cd backend
            uv export --frozen --no-dev --format requirements-txt > requirements.txt
            uv run pip-audit -r requirements.txt

  build-scan:
    docker:
      - image: mirror.gcr.io/cimg/base:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Skip when nothing this job covers changed (fails closed)
          command: bash scripts/ci/skip_unless_changed.sh backend/ infra/ .trivyignore .circleci/
      - setup_remote_docker
      - run:
          name: Build image (no attestations -> one Artifact Registry version)
          command: |
            cd backend
            docker buildx build --provenance=false --sbom=false --load -t clinic-api:ci .
      - trivy_cache_restore
      - run:
          name: Trivy image + config scan (HIGH/CRITICAL, fixed only)
          command: |
            VERSION=0.76.0
            curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" | tar -xz trivy
            ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 clinic-api:ci
            # trivy config takes ONE path per call; scan the Dockerfile, and infra/ once it exists.
            ./trivy config --exit-code 1 --severity HIGH,CRITICAL backend/Dockerfile
            if [ -d infra ]; then ./trivy config --exit-code 1 --severity HIGH,CRITICAL infra; fi
      - trivy_cache_save
  dast:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Skip when nothing this job covers changed (fails closed)
          command: bash scripts/ci/skip_unless_changed.sh backend/ docker-compose.yml .zap/ .circleci/
      - run:
          name: ZAP API scan against the compose stack
          command: |
            docker compose up -d --build --wait
            NET=$(docker network ls --filter name=clinic_default --format '{{.Name}}')
            chmod a+rwx .zap   # the ZAP container user is not the runner's uid
            set +e
            docker run --rm --network "$NET" -v "$PWD/.zap:/zap/wrk" \
              ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
              zap-api-scan.py -t http://api:8080/openapi.json -f openapi -c rules.tsv -r zap-report.html
            code=$?
            echo "zap exit=$code"
            # 0 = no alerts, 2 = warnings only -> pass; 1, 3 -> fail.
            [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
      - store_artifacts:
          path: .zap/zap-report.html

  # ---------------------------------------------------------------- release-only jobs
  # These need the engineer's cloud setup (contexts gcp-deploy / vercel-prod, WIF). They are
  # inert until the GCP and Vercel setup (WIF pools, service accounts, contexts) has been
  # applied; nothing here creates infrastructure.
  build-scan-push:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: WIF login + Artifact Registry docker auth
          command: |
            bash scripts/ci/gcp_login.sh
            gcloud auth configure-docker "us-east4-docker.pkg.dev" --quiet
      - run:
          name: Build (one manifest -> one Artifact Registry version)
          command: |
            IMAGE="us-east4-docker.pkg.dev/${GOOGLE_PROJECT_ID}/clinic/clinic-api:sha-${CIRCLE_SHA1:0:7}"
            docker buildx build --provenance=false --sbom=false --load -t "$IMAGE" backend
            echo "export IMAGE=$IMAGE" >> "$BASH_ENV"
      - trivy_cache_restore
      - run:
          name: Trivy scan before push (HIGH/CRITICAL, fixed only)
          command: |
            VERSION=0.76.0
            curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" | tar -xz trivy
            ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - trivy_cache_save
      - run:
          name: Push and record the digest
          command: |
            docker push "$IMAGE"
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
            mkdir -p /tmp/ws
            printf %s "$DIGEST" > /tmp/ws/image_ref
      - persist_to_workspace:
          root: /tmp/ws
          paths:
            - image_ref

  ship-api:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Deploy marker, planned (CircleCI Deploys)
          command: |
            circleci run release plan ship-api --environment-name=production \
              --component-name=clinic-api --namespace=clinic --target-version="sha-${CIRCLE_SHA1:0:7}" || echo "WARNING - the deploy marker was not recorded"
      - run:
          name: WIF login
          command: bash scripts/ci/gcp_login.sh
      - run:
          name: Deploy marker, running
          command: circleci run release update ship-api --status=running || echo "WARNING - the deploy marker was not updated"
      - run:
          name: Migrate (Cloud Run job, bounded timeout, no retries)
          command: |
            IMAGE_REF="$(cat /tmp/ws/image_ref)"
            gcloud run jobs deploy clinic-migrate --image "$IMAGE_REF" --region us-east4 --service-account "clinic-migrate@${GOOGLE_PROJECT_ID}.iam.gserviceaccount.com" --set-secrets DATABASE_URL=clinic-database-url-migrate:latest --task-timeout 600s --max-retries 0 --command sh --args="-c,alembic upgrade head && python -m app.scripts.seed" --quiet
            gcloud run jobs execute clinic-migrate --region us-east4 --wait
      - owner_emails
      - run:
          name: Deploy a tagged revision with no traffic
          command: |
            : "${OWNER_EMAILS:?the owner_emails step did not run}"
            : "${PUBLIC_BASE_URL:?gcp-deploy context is missing PUBLIC_BASE_URL}"
            : "${WEB_ORIGIN:?gcp-deploy context is missing WEB_ORIGIN}"
            : "${GOOGLE_PROJECT_ID:?gcp-deploy context is missing GOOGLE_PROJECT_ID}"
            IMAGE_REF="$(cat /tmp/ws/image_ref)"
            gcloud run deploy clinic-api --image "$IMAGE_REF" --region us-east4 --no-traffic --tag "sha-${CIRCLE_SHA1:0:7}" --service-account "clinic-api-runtime@${GOOGLE_PROJECT_ID}.iam.gserviceaccount.com" --set-secrets DATABASE_URL=clinic-database-url-app:latest,INTERNAL_SIGNING_KEY=clinic-internal-signing-key:latest,SMOKE_SIGNING_KEY=clinic-smoke-signing-key:latest,ABLY_API_KEY=clinic-ably-api-key:latest --set-env-vars "GIT_SHA=${CIRCLE_SHA1},PUBLIC_BASE_URL=${PUBLIC_BASE_URL},WEB_ORIGIN=${WEB_ORIGIN},ADMIN_EMAILS=${OWNER_EMAILS}" --min-instances 0 --max-instances 3 --concurrency 80 --cpu 1 --memory 512Mi --cpu-boost --timeout 60 --add-custom-audiences=clinic-api --quiet
      - run:
          name: Tag-URL smoke behind the C19 egress gate
          command: |
            set +x
            TAG_URL="$(gcloud run services describe clinic-api --region us-east4 --format=json | jq -r '.status.traffic[]|select(.tag=="sha-'"${CIRCLE_SHA1:0:7}"'")|.url')"
            test -n "$TAG_URL" || { echo 'FAIL: tag URL not found'; exit 1; }
            test "$(curl -s --max-time 5 https://ipinfo.io/country)" = US || { echo 'FAIL C19: CircleCI egress outside North America; tag-URL smoke skipped, nothing promoted'; exit 1; }
            python3 -m pip install --quiet httpx
            TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="clinic-smoke@${GOOGLE_PROJECT_ID}.iam.gserviceaccount.com" --audiences=clinic-api)"
            SMOKE_SIGNING_KEY="$(gcloud secrets versions access latest --secret=clinic-smoke-signing-key --project="${GOOGLE_PROJECT_ID}")"
            export SMOKE_SIGNING_KEY
            python3 scripts/verify_claims.py --base-url "$TAG_URL" --header "X-Serverless-Authorization: Bearer ${TOKEN}" --require-synthetic
      - run:
          name: Promote only if this commit is still main's head
          command: bash scripts/ci/promote.sh "sha-${CIRCLE_SHA1:0:7}"
      - persist_to_workspace:
          root: /tmp/promoted
          paths:
            - state
            - keep.json
      - run:
          name: Prune superseded revisions and images (a failed lookup deletes nothing; cost-check C5/C6 still count)
          command: bash scripts/ci/prune.sh || echo "WARN prune failed; the next cost-check will report any extra versions"
      - run:
          name: Deploy marker, success
          command: circleci run release update ship-api --status=SUCCESS || echo "WARNING - the deploy marker was not updated"
          when: on_success
      - run:
          name: Deploy marker, failed
          command: circleci run release update ship-api --status=FAILED --failure-reason="ship-api failed" || echo "WARNING - the deploy marker was not updated"
          when: on_fail

  build-scan-push-realtime:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: WIF login + Artifact Registry docker auth
          command: |
            bash scripts/ci/gcp_login.sh
            gcloud auth configure-docker "us-east4-docker.pkg.dev" --quiet
      - run:
          name: Build the gateway image (one manifest -> one Artifact Registry version) and hold it to 25 MB
          command: |
            IMAGE="us-east4-docker.pkg.dev/${GOOGLE_PROJECT_ID}/clinic/clinic-realtime:sha-${CIRCLE_SHA1:0:7}"
            docker buildx build --provenance=false --sbom=false --load -t "$IMAGE" services/realtime
            echo "export IMAGE=$IMAGE" >> "$BASH_ENV"
            SIZE="$(docker image inspect --format '{{.Size}}' "$IMAGE")"
            echo "clinic-realtime image: ${SIZE} bytes"
            test "$SIZE" -lt 25000000 || { echo "FAIL: the gateway image is ${SIZE} bytes, over the 25 MB cost guard"; exit 1; }
      - trivy_cache_restore
      - run:
          name: Trivy scan before push (HIGH/CRITICAL, fixed only)
          command: |
            VERSION=0.76.0
            curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" | tar -xz trivy
            ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - trivy_cache_save
      - run:
          name: Push and record the digest
          command: |
            docker push "$IMAGE"
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
            mkdir -p /tmp/ws
            printf %s "$DIGEST" > /tmp/ws/image_ref_realtime
      - persist_to_workspace:
          root: /tmp/ws
          paths:
            - image_ref_realtime

  ship-realtime:
    description: Deploy the live-feed gateway the way ship-api deploys the API (a tagged revision with no traffic, a smoke on that revision, promotion only if this commit is still main's head). Scales from zero to at most two instances on demand and back to zero when idle.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Deploy marker, planned (CircleCI Deploys)
          command: |
            circleci run release plan ship-realtime --environment-name=production \
              --component-name=clinic-realtime --namespace=clinic --target-version="sha-${CIRCLE_SHA1:0:7}" || echo "WARNING - the deploy marker was not recorded"
      - run:
          name: WIF login
          command: bash scripts/ci/gcp_login.sh
      - run:
          name: Deploy marker, running
          command: circleci run release update ship-realtime --status=running || echo "WARNING - the deploy marker was not updated"
      - run:
          name: Prerequisites a human sets once (a clear failure here, not a mysterious one later)
          command: bash scripts/ci/realtime_prereqs.sh
      - owner_emails
      - run:
          name: Deploy a tagged revision with no traffic (min 0, max 2, concurrency 1, request-based billing)
          command: |
            : "${OWNER_EMAILS:?the owner_emails step did not run}"
            : "${PUBLIC_BASE_URL:?gcp-deploy context is missing PUBLIC_BASE_URL}"
            : "${GOOGLE_PROJECT_ID:?gcp-deploy context is missing GOOGLE_PROJECT_ID}"
            IMAGE_REF="$(cat /tmp/ws/image_ref_realtime)"
            gcloud run deploy clinic-realtime --image "$IMAGE_REF" --region us-east4 --no-traffic --tag "sha-${CIRCLE_SHA1:0:7}" --service-account "clinic-realtime-runtime@${GOOGLE_PROJECT_ID}.iam.gserviceaccount.com" --set-secrets DATABASE_URL=clinic-database-url-realtime:latest,INTERNAL_SIGNING_KEY=clinic-internal-signing-key:latest,SMOKE_SIGNING_KEY=clinic-smoke-signing-key:latest --set-env-vars "GIT_SHA=${CIRCLE_SHA1},PROBLEMS_BASE_URL=${PUBLIC_BASE_URL},ADMIN_EMAILS=${OWNER_EMAILS},MAX_STREAMS_PER_INSTANCE=1,MAX_STREAMS_PER_PERSON=1,MAX_CONNECTION=290s,IDLE_TIMEOUT=240s" --min-instances 0 --max-instances 2 --concurrency 1 --cpu 0.25 --memory 256Mi --execution-environment gen1 --cpu-boost --timeout 900 --add-custom-audiences=clinic-realtime --no-allow-unauthenticated --quiet
      - run:
          name: The invoker bindings exist (only the admin app and the smoke identity)
          command: bash scripts/ci/realtime_prereqs.sh --after-deploy
      - run:
          name: Tag-URL smoke behind the C19 egress gate
          command: |
            set +x
            TAG_URL="$(gcloud run services describe clinic-realtime --region us-east4 --format=json | jq -r '.status.traffic[]|select(.tag=="sha-'"${CIRCLE_SHA1:0:7}"'")|.url')"
            test -n "$TAG_URL" || { echo 'FAIL: tag URL not found'; exit 1; }
            API_URL="$(gcloud run services describe clinic-api --region us-east4 --format='value(status.url)')"
            test -n "$API_URL" || { echo 'FAIL: the live API URL was not found'; exit 1; }
            test "$(curl -s --max-time 5 https://ipinfo.io/country)" = US || { echo 'FAIL C19: CircleCI egress outside North America; tag-URL smoke skipped, nothing promoted'; exit 1; }
            python3 -m pip install --quiet httpx
            SMOKE_SA="clinic-smoke@${GOOGLE_PROJECT_ID}.iam.gserviceaccount.com"
            export REALTIME_URL="$TAG_URL" API_URL
            export REALTIME_TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$SMOKE_SA" --audiences=clinic-realtime)"
            export API_TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$SMOKE_SA" --audiences=clinic-api)"
            export SMOKE_SIGNING_KEY="$(gcloud secrets versions access latest --secret=clinic-smoke-signing-key --project="${GOOGLE_PROJECT_ID}")"
            python3 scripts/ci/realtime_smoke.py
      - run:
          name: Promote only if this commit is still main's head
          command: SERVICE=clinic-realtime PROMOTE_DIR=/tmp/promoted-realtime bash scripts/ci/promote.sh "sha-${CIRCLE_SHA1:0:7}"
      - run:
          name: Live check after promotion, and back to the previous revision at once if it fails
          command: |
            grep -qx promoted /tmp/promoted-realtime/state || { echo "not promoted; nothing to check"; exit 0; }
            SMOKE_SA="clinic-smoke@${GOOGLE_PROJECT_ID}.iam.gserviceaccount.com"
            URL="$(gcloud run services describe clinic-realtime --region us-east4 --format='value(status.url)')"
            TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$SMOKE_SA" --audiences=clinic-realtime)"
            if ! curl -fsS --max-time 30 -H "X-Serverless-Authorization: Bearer ${TOKEN}" "$URL/health"; then
              echo "FAIL: the promoted revision does not answer /health; rolling back"
              SERVICE=clinic-realtime PROMOTE_DIR=/tmp/promoted-realtime bash scripts/ci/rollback.sh || true
              exit 1
            fi
      - persist_to_workspace:
          root: /tmp
          paths:
            - promoted-realtime/state
            - promoted-realtime/keep.json
      - run:
          name: Prune superseded revisions and images (a failed lookup deletes nothing; cost-check C5/C6 still count)
          command: SERVICE=clinic-realtime AR_PACKAGE="us-east4-docker.pkg.dev/${GOOGLE_PROJECT_ID}/clinic/clinic-realtime" PROMOTE_DIR=/tmp/promoted-realtime bash scripts/ci/prune.sh || echo "WARN prune failed; the next cost-check will report any extra versions"
      - run:
          name: Deploy marker, success
          command: circleci run release update ship-realtime --status=SUCCESS || echo "WARNING - the deploy marker was not updated"
          when: on_success
      - run:
          name: Deploy marker, failed
          command: circleci run release update ship-realtime --status=FAILED --failure-reason="ship-realtime failed" || echo "WARNING - the deploy marker was not updated"
          when: on_fail

  build-app:
    parameters:
      app:
        description: The app directory under apps/ (booking or admin)
        type: string
    docker:
      - image: mirror.gcr.io/cimg/node:24.14
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install without lifecycle scripts, then build with no Vercel credential
          command: |
            sudo npm install -g pnpm@12.5.1
            pnpm install --frozen-lockfile --ignore-scripts
            VERCEL_APP_DIR="apps/<< parameters.app >>" bash scripts/ci/vercel_offline_build.sh
            mv .vercel/output ".vercel/output-<< parameters.app >>"
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - persist_to_workspace:
          # The prebuilt output points at files in the repo tree (apps/<app>/.next, about 27 MB), not
          # only at .vercel/output, so both travel to the deploy job.
          root: /home/circleci/repo
          paths:
            - .vercel/output-<< parameters.app >>
            - apps/<< parameters.app >>/.next

  ship-app:
    parameters:
      app:
        description: The app directory under apps/ (booking or admin)
        type: string
      project_id:
        description: Vercel project id for this app when it differs from the context's (not a secret)
        type: string
        default: ""
      component:
        description: The component name on the CircleCI deploy marker
        type: string
    docker:
      - image: mirror.gcr.io/cimg/node:24.14
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Choose this app's Vercel token (the admin app has its own project and token)
          command: bash scripts/ci/select_vercel_token.sh "<< parameters.app >>"
      - run:
          name: Select the Vercel project for this app (the context holds the booking project's id)
          command: |
            echo 'export VERCEL_APP="<< parameters.app >>"' >> "$BASH_ENV"
            if [ -n "<< parameters.project_id >>" ]; then
              echo 'export VERCEL_PROJECT_ID="<< parameters.project_id >>"' >> "$BASH_ENV"
            fi
            # Identifiers only (never the token), so a 403 can be told from a wrong project.
            PROJECT="<< parameters.project_id >>"; PROJECT="${PROJECT:-$VERCEL_PROJECT_ID}"
            echo "Vercel target: app=<< parameters.app >> project=${PROJECT} team=${VERCEL_ORG_ID:0:9}..."
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless ship-api promoted this commit
          command: |
            if ! grep -qx promoted /tmp/ws/state 2>/dev/null; then
              echo "ship-api did not promote this commit: the web builds must not ship a contract newer than the live API."
              circleci-agent step halt
            fi
      - run:
          name: Halt if a newer commit already owns main
          command: bash scripts/ci/require_head.sh
      - run:
          name: Deploy marker, planned and running (CircleCI Deploys)
          command: |
            circleci run release plan ship-<< parameters.app >> --environment-name=production \
              --component-name=<< parameters.component >> --namespace=clinic --target-version="sha-${CIRCLE_SHA1:0:7}" || echo "WARNING - the deploy marker was not recorded"
            circleci run release update ship-<< parameters.app >> --status=running || echo "WARNING - the deploy marker was not updated"
      - run:
          name: Install dependencies and the Vercel CLI without lifecycle scripts
          command: |
            # The prebuilt output lists files under the root node_modules, and the CLI checks that
            # they exist before uploading, so a fresh checkout needs the same install as the build.
            # Scripts stay off, so no package code runs in the job that holds the Vercel token.
            sudo npm install -g pnpm@12.5.1 vercel@59.5.0 --ignore-scripts
            pnpm install --frozen-lockfile --ignore-scripts
      - run:
          name: Refuse to ship when the Vercel project lacks a required variable (names only)
          command: bash scripts/ci/vercel_env_check.sh "<< parameters.app >>" production
      - run:
          name: Record the production deployment that is live now (the rollback target)
          command: |
            mkdir -p /tmp/webstate
            export VERCEL_APP="<< parameters.app >>"
            bash scripts/ci/vercel_prod.sh current | tee "/tmp/webstate/prev-<< parameters.app >>"
      - run:
          name: Deploy the prebuilt output (the only step that needs the Vercel token)
          command: |
            mkdir -p .vercel
            cp -R "/tmp/ws/.vercel/output-<< parameters.app >>" .vercel/output
            cp -R "/tmp/ws/apps/<< parameters.app >>/.next" "apps/<< parameters.app >>/.next"
            export VERCEL_APP="<< parameters.app >>"
            URL="$(npm_config_ignore_scripts=true vercel deploy --prebuilt --prod | tail -1)"
            echo "deployed $URL"
            NEW="$(bash scripts/ci/vercel_prod.sh id-of "$URL")"
            # A rollback switches off automatic alias assignment, so make sure the public alias
            # really serves this deployment, promoting it if it does not.
            bash scripts/ci/vercel_prod.sh ensure "$NEW" | tee "/tmp/webstate/new-<< parameters.app >>"
      - persist_to_workspace:
          root: /tmp/webstate
          paths:
            - prev-<< parameters.app >>
            - new-<< parameters.app >>
      - run:
          name: Deploy marker, success
          command: circleci run release update ship-<< parameters.app >> --status=SUCCESS || echo "WARNING - the deploy marker was not updated"
          when: on_success
      - run:
          name: Deploy marker, failed
          command: circleci run release update ship-<< parameters.app >> --status=FAILED --failure-reason="ship-<< parameters.app >> failed" || echo "WARNING - the deploy marker was not updated"
          when: on_fail

  web-quality:
    docker:
      - image: mirror.gcr.io/cimg/node:24.14
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Skip when apps/, packages/ and contracts/ are untouched (fails closed)
          command: bash scripts/ci/skip_unless_changed.sh apps/ packages/ contracts/ pnpm-lock.yaml pnpm-workspace.yaml package.json scripts/ci/lighthouse/
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install, lint, typecheck, test, build
          command: |
            sudo npm install -g pnpm@12.5.1
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm audit --prod --audit-level high
            # the pinned Lighthouse CI runner has its own lockfile and so its own audit
            pnpm --dir scripts/ci/lighthouse install --frozen-lockfile --ignore-scripts
            pnpm --dir scripts/ci/lighthouse audit --audit-level high
            pnpm -r --if-present test
            pnpm -r --if-present build
            # Both built apps, started with no sign-in settings, must answer 503, never 500.
            bash scripts/ci/not_configured_smoke.sh
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

  e2e-real:
    # Every browser scenario, and the generated client, against the real API and database from
    # docker-compose (migrations and seed included). There is no stand-in API.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Skip when nothing this job covers changed (fails closed)
          command: bash scripts/ci/skip_unless_changed.sh apps/ packages/ backend/ contracts/ docker-compose.yml pnpm-lock.yaml pnpm-workspace.yaml package.json scripts/ci/lighthouse.sh scripts/ci/lighthouserc.cjs scripts/ci/lighthouse/ .circleci/
      - run:
          name: Throwaway keys for this run (the API checks signed assertions, the app signs sessions)
          command: |
            echo "export INTERNAL_SIGNING_KEY=$(openssl rand -hex 32)" >> "$BASH_ENV"
            echo "export BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$BASH_ENV"
            echo "export CRON_SECRET=$(openssl rand -hex 32)" >> "$BASH_ENV"
            # Every booking sends an email: keep the day's counter from limiting the run (the cap has its own scenario)
            echo "export EMAIL_DAILY_LIMIT=100000 EMAIL_MONTHLY_LIMIT=1000000 EMAIL_ACK_RESERVE=0" >> "$BASH_ENV"
      - run:
          name: API and database (compose runs the migrations and the seed)
          command: WEB_ORIGIN=http://localhost:3100 docker compose up -d --build --wait
      - run:
          name: Build the booking app and run the booking scenarios against the real API
          command: |
            # The machine image has no Node 24: fetch the official build and check it against its
            # published SHA-256 before using it.
            curl -fsSLO https://nodejs.org/dist/v24.14.0/node-v24.14.0-linux-x64.tar.xz
            echo "41cd79bb7877c81605a9e68ec4c91547774f46a40c67a17e34d7179ef11729df  node-v24.14.0-linux-x64.tar.xz" | sha256sum -c -
            sudo tar -xJf node-v24.14.0-linux-x64.tar.xz -C /usr/local --strip-components=1
            node --version
            sudo npm install -g pnpm@12.5.1
            pnpm install --frozen-lockfile --ignore-scripts
            # the generated client against the real API (reads, real problems, the whole booking path)
            REAL_API_URL=http://127.0.0.1:8080 pnpm -C packages/api exec vitest run tests/real-api.test.ts
            # the same Google person on two app instances gets the same patient (real OAuth callback, real API)
            REAL_API_URL=http://127.0.0.1:8080 pnpm -C apps/booking exec vitest run tests/two-instances.test.ts tests/email-allowance.test.ts
            pnpm -C apps/booking build
            pnpm -C apps/booking exec playwright install --with-deps chromium
            E2E_API_URL=http://127.0.0.1:8080 PW_BUNDLED=1 pnpm -C apps/booking test:e2e
      - run:
          name: Lighthouse budgets on / /book /about /data (production build, docs/adr/0026)
          command: |
            # Same build and API as the scenarios above; chromium is the Playwright one. lhci is
            # pinned inside the script. The result is recorded, not raised, so the reports are
            # stored as artifacts even when a budget is missed; the next step enforces it.
            set +e
            E2E_API_URL=http://127.0.0.1:8080 bash scripts/ci/lighthouse.sh
            echo $? > /tmp/lighthouse-exit
            exit 0
      - store_artifacts:
          path: /tmp/lighthouse
          destination: lighthouse
      - run:
          name: Enforce the Lighthouse budgets
          command: test "$(cat /tmp/lighthouse-exit)" = 0
      - run:
          name: Rebuild the booking app the way the release does and check it loads reCAPTCHA (public build env)
          command: |
            # The release builds with no Vercel environment, so NEXT_PUBLIC_* come from
            # scripts/ci/public-build.env. This builds with exactly those values and checks the details
            # page loads reCAPTCHA Enterprise with the key (regression test for the missing-token outage).
            export $(awk '$1 == "booking" { sub(/^[^ ]+ /, ""); print }' scripts/ci/public-build.env)
            pnpm -C apps/booking build
            E2E_PUBLIC_BUILD=1 E2E_EXPECT_SITE_KEY="$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" E2E_API_URL=http://127.0.0.1:8080 PW_BUNDLED=1 \
              pnpm -C apps/booking exec playwright test e2e/recaptcha-script.spec.ts
      - run:
          name: API logs
          command: docker compose logs api | tail -80
          when: on_fail

