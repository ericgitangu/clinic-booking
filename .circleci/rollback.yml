# Rollback pipeline for CircleCI Deploys (Project Settings -> Deploys -> Rollback Pipeline).
# CircleCI fills in pipeline.deploy.* from the release being rolled back; target_version is the
# release to go back to, in the same form the deploy markers use (sha-<7>). The automatic path
# lives in the release workflow (verify-release); this is the manual, one-click one.
version: 2.1

jobs:
  rollback-api:
    docker:
      - image: mirror.gcr.io/cimg/python:3.12
    resource_class: small
    working_directory: ~/repo
    environment:
      TARGET_VERSION: << pipeline.deploy.target_version >>
    steps:
      - checkout
      - run:
          name: Deploy marker, planned rollback
          command: |
            circleci run release plan rollback-api --environment-name=<< pipeline.deploy.environment_name >> \
              --component-name=<< pipeline.deploy.component_name >> --target-version="${TARGET_VERSION}" --rollback
      - run:
          name: Move traffic back to the tagged revision
          command: |
            bash scripts/ci/gcp_login.sh
            # same guards as the automatic rollback: the tag must exist and run an image from our registry
            bash scripts/ci/rollback.sh --to-tag "${TARGET_VERSION}"
      - run:
          name: Deploy marker, success
          command: circleci run release update rollback-api --status=SUCCESS

  rollback-app:
    parameters:
      app:
        description: The app directory under apps/ (booking or admin)
        type: string
    docker:
      - image: mirror.gcr.io/cimg/node:24.14
    resource_class: small
    working_directory: ~/repo
    environment:
      TARGET_VERSION: << pipeline.deploy.target_version >>
    steps:
      - checkout
      - run:
          name: Deploy marker, planned rollback
          command: |
            circleci run release plan rollback-<< parameters.app >> --environment-name=<< pipeline.deploy.environment_name >> \
              --component-name=<< pipeline.deploy.component_name >> --target-version="${TARGET_VERSION}" --rollback
      - run:
          name: Point production at the previous Vercel deployment (TARGET_VERSION is not used here)
          command: |
            sudo npm install -g vercel@59.5.0 --ignore-scripts
            export VERCEL_APP="<< parameters.app >>"
            bash scripts/ci/vercel_prod.sh rollback "$(bash scripts/ci/vercel_prod.sh previous)"
      - run:
          name: Deploy marker, success
          command: circleci run release update rollback-<< parameters.app >> --status=SUCCESS

workflows:
  rollback-api:
    when:
      equal: [clinic-api, << pipeline.deploy.component_name >>]
    jobs:
      - rollback-api:
          context: gcp-deploy
  rollback-booking:
    when:
      equal: [clinic-web, << pipeline.deploy.component_name >>]
    jobs:
      - rollback-app:
          app: booking
          context: vercel-prod
  rollback-admin:
    when:
      equal: [clinic-admin, << pipeline.deploy.component_name >>]
    jobs:
      - rollback-app:
          app: admin
          context: vercel-admin
