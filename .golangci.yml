# Applies to services/realtime once it exists. Strict from the first commit: no baseline, no
# per-linter issue caps, so nothing gets grandfathered in.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - unconvert
    - unparam

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
