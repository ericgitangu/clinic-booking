<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You are offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem;
        font: 1.125rem/1.6 system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
      main { max-width: 32rem; }
      h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
      button { font: inherit; min-height: 3rem; padding: 0 1.25rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Booking needs a connection, so no appointment details are kept on this device. Reconnect
        and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
