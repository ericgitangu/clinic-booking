[project]
name = "clinic-booking-api"
version = "0.1.0"
description = "Clinic booking REST API (FastAPI + Postgres)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "pydantic==2.14.1",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "httpx>=0.28,<1",
    "schemathesis==4.31.1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pip-audit>=2.10,<3",
]

# No [build-system]: this is an application project (deps only), `app` is imported
# from the project root. Keeps `uv sync --frozen --no-dev` from trying to build a wheel.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "TID"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and hard-coded test values.
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S607"]
# The clock module is the one place allowed to call wall-clock APIs.
"app/core/clock.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "use app.core.clock.Clock.now(); wall-clock reads are banned outside app/core/clock.py"
"datetime.datetime.utcnow".msg = "use app.core.clock.Clock.now(); wall-clock reads are banned outside app/core/clock.py"
"datetime.datetime.today".msg = "use app.core.clock.Clock.now(); wall-clock reads are banned outside app/core/clock.py"
"datetime.date.today".msg = "use app.core.clock.Clock.now(); wall-clock reads are banned outside app/core/clock.py"
"time.time".msg = "use app.core.clock.Clock.now(); wall-clock reads are banned outside app/core/clock.py"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "race: concurrency race tests",
    "control: naive-control concurrency tests",
]
