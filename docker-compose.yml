name: clinic

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      # Host publish port is overridable to avoid collisions; container port is always 5432.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    # No fixed image name: compose names the built image after the project (<project>-migrate,
    # <project>-api), so two projects on one machine never share, or overwrite, each other's image.
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.seed"]
    environment:
      # Owner role runs migrations and the seed.
      DATABASE_URL: postgresql+asyncpg://clinic:clinic@db:5432/clinic
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # The live-feed gateway (services/realtime). Optional: `docker compose --profile realtime up`.
  # It reads the event log as the read-only clinic_realtime role and answers only a signed staff
  # assertion made with INTERNAL_SIGNING_KEY, so that key and ADMIN_EMAILS must be set.
  realtime:
    profiles: ["realtime"]
    build:
      context: ./services/realtime
    environment:
      DATABASE_URL: postgres://clinic_realtime:clinic_realtime_local@db:5432/clinic
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      PORT: "8080"
      # The e2e revokes a person and expects the stream to end; production re-checks every 30 s.
      ROLE_RECHECK: 2s
    ports:
      - "${REALTIME_HOST_PORT:-8090}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/realtime", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      # Runtime role: SELECT/INSERT/UPDATE only.
      DATABASE_URL: postgresql+asyncpg://clinic_app:clinic_app_local@db:5432/clinic
      # The site that may ask for live-updates tokens (and the CORS origin). The end-to-end runs
      # serve the app on 3100 and set WEB_ORIGIN accordingly.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PUBLIC_BASE_URL: http://localhost:8080
      LOG_LEVEL: info
      PORT: "8080"
      # Empty (the default) leaves /internal/* closed; set a 32+ character key to use the admin app.
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:-}
      # Empty (the default) refuses the release smoke test's synthetic-patient call; must differ from the key above.
      SMOKE_SIGNING_KEY: ${SMOKE_SIGNING_KEY:-}
      # Comma-separated owner emails for the admin app; the same value as the app's ADMIN_EMAILS.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Empty (the default) means push is off and clients poll; set your own Ably app key to try live updates.
      ABLY_API_KEY: ${ABLY_API_KEY:-}
      # The email allowances (Resend free plan: 100 a day, 3,000 a month). Overridable so the
      # end-to-end runs, which send an email per booking, are not limited by the day's counter.
      EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-100}
      EMAIL_MONTHLY_LIMIT: ${EMAIL_MONTHLY_LIMIT:-3000}
      EMAIL_ACK_RESERVE: ${EMAIL_ACK_RESERVE:-20}
    ports:
      # Host port overridable (make e2e uses its own, so it never meets a developer's running stack).
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')
      interval: 3s
      timeout: 3s
      retries: 20
