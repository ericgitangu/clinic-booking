packages:
  - apps/*
  - packages/*
# Dependency lifecycle scripts are denied by default. unrs-resolver only downloads an optional
# native resolver that ESLint does not need.
# Refuse a dependency version whose publish-time trust evidence is weaker than an earlier one.
trustPolicy: no-downgrade
blockExoticSubdeps: true
# TECH DEBT: 1 day, not the 7 days the semgrep rule wants: 40 locked versions are under 7 days old
# (rolldown/oxc), so 10080 fails the install. Raise it when the lockfile ages past the window.
minimumReleaseAge: 1440 # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
# Four locked versions already fail the policy (pnpm reports a trust downgrade against an earlier
# release: @vercel/* are pulled in by the vercel CLI, semver@6 by tooling). Excluded by exact
# version so any other downgrade, or a bump of these, is still refused. TECH DEBT: not reviewed
# for takeover; re-check when the vercel CLI or its semver range moves.
trustPolicyExclude:
  - '@vercel/cli-config@0.3.1'
  - '@vercel/cli-exec@1.0.1'
  - '@vercel/oidc@4.0.1'
  - semver@6.3.1
  # recharts (the dashboard charts) depends on reselect, whose 5.1.1 release has no publish
  # provenance while an earlier release had. Checked on the registry 2026-10-17: the maintainers
  # are the Redux team and 5.1.1 is the latest tag. TECH DEBT: accepted by exact version, not
  # audited line by line; drop this entry once reselect publishes with provenance again.
  - reselect@5.1.1
allowBuilds:
  '@swc/core': false
  esbuild: false
  # redoc's analytics postinstall; nothing the build needs.
  '@scarf/scarf': false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@next/env@16.4.2'
  - '@next/eslint-plugin-next@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
  - '@next/swc-linux-arm64-musl@16.4.2'
  - '@next/swc-linux-x64-gnu@16.4.2'
  - '@next/swc-linux-x64-musl@16.4.2'
  - '@next/swc-win32-arm64-msvc@16.4.2'
  - '@next/swc-win32-x64-msvc@16.4.2'
  - eslint-config-next@16.4.2
  - next@16.4.2
# Dev and CI tooling only (markdownlint, openapi-ts, commitlint, eslintrc), none of it shipped.
# Forced to the patched releases of GHSA-h67p-54hq-rp68, GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj,
# GHSA-2883-xcg3-v3hh (js-yaml), GHSA-6v5v-wf23-fmfq, GHSA-253c-mchw-3w2r (markdown-it) and
# GHSA-238p-pmpm-9mq7 (katex). Drop an entry once its parent ships on a patched range.
overrides:
  js-yaml@^4: '>=4.3.2 <5'
  markdown-it@^14: '>=14.3.1 <15'
  katex@^0.16: '>=0.18.2 <0.19'
