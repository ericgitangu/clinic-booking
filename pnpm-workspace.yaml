packages:
  - web
# Dependency lifecycle scripts are denied by default. unrs-resolver only downloads an optional
# native resolver that ESLint does not need.
# Refuse a dependency version whose publish-time trust evidence is weaker than an earlier one.
trustPolicy: no-downgrade
blockExoticSubdeps: true
minimumReleaseAge: 1440
# Four locked versions already fail the policy (pnpm reports a trust downgrade against an earlier
# release: @vercel/* are pulled in by the vercel CLI, semver@6 by tooling). Excluded by exact
# version so any other downgrade, or a bump of these, is still refused. TECH DEBT: not reviewed
# for takeover; re-check when the vercel CLI or its semver range moves.
trustPolicyExclude:
  - '@vercel/cli-config@0.3.1'
  - '@vercel/cli-exec@1.0.1'
  - '@vercel/oidc@4.0.1'
  - semver@6.3.1
allowBuilds:
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@next/env@16.4.2'
  - '@next/eslint-plugin-next@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
  - '@next/swc-linux-arm64-musl@16.4.2'
  - '@next/swc-linux-x64-gnu@16.4.2'
  - '@next/swc-linux-x64-musl@16.4.2'
  - '@next/swc-win32-arm64-msvc@16.4.2'
  - '@next/swc-win32-x64-msvc@16.4.2'
  - eslint-config-next@16.4.2
  - next@16.4.2
